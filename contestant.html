<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GoVote — Live Vote Counter</title>
  <link rel="stylesheet" href="contestant.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="top-bar">
      <button class="back-button back-btn" aria-label="Back">
        <svg class="back-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
    </div>

<div class="voting-card">
  <div class="image-placeholder" id="dynamicImagePlaceholder"></div>

  <div class="card-content">
    <div class="gradient"></div>
    <div class="contestant-name" id="contestantName">Offor Franklin</div>
    <div class="contestant-detail" id="contestantDetail">COMPUTER SCIENCE, 300LVL</div>

    <div class="vote-digits" id="digitContainer">
      <div class="digit-box one" id="digit1">0</div>
      <div class="digit-box" id="digit2">0</div>
      <div class="digit-box" id="digit3">0</div>
      <div class="digit-box two" id="digit4">0</div>
    </div>

    <div class="live-label">Live Vote Counter</div>

    <button class="vote-btn" id="voteNowBtn">Vote Now</button>

    <div class="about-title">About Contestant</div>
    <div class="about-text" id="aboutText">
      Browse through multiple categories and vote for your respective stars...
    </div>

    <div class="footer-note">GoVote • real‑time counter</div>
  </div>
</div>

<script>
  (function() {
    // ----- Contestant database (static info) -----
    const contestantsData = {
      offor: {
        name: "Offor Franklin",
        detail: "COMPUTER SCIENCE, 300LVL",
        about: "Offor Franklin is a Computer Science student with a passion for building digital solutions. Known for his sharp analytical mind, he's a top contender in Master GOUNI 2026. His leadership and innovative thinking have earned admiration across campus.",
        imageUrl: "https://placehold.co/600x400/2A2A2A/C9A95C?text=Offor+Franklin"
      },
      obi: {
        name: "Obi Emmanuel",
        detail: "COMPUTER ENGINEERING, 400LVL",
        about: "Obi Emmanuel blends engineering excellence with charismatic leadership. As a final-year student, Obi has driven impactful tech projects. His vision for progress and ability to inspire others makes him a standout contestant.",
        imageUrl: "https://placehold.co/600x400/2A2A2A/C9A95C?text=Obi+Emmanuel"
      },
      mark: {
        name: "Mark Roth",
        detail: "MASS COMMUNICATION, 200LVL",
        about: "Miko Roth is a vibrant communicator and crowd favorite. With a strong media background, Miko uses influence to advocate for youth causes. Her energy and eloquence have captured the hearts of many voters.",
        imageUrl: "https://placehold.co/600x400/2A2A2A/C9A95C?text=Miko+Roth"
      }
    };

    // ----- LocalStorage helpers (votes start at 0) -----
    function getStoredVotes() {
      const stored = localStorage.getItem('contestantVotes');
      if (stored) {
        try { return JSON.parse(stored); } catch(e) { return {}; }
      }
      return {};
    }

    function saveStoredVotes(votesObj) {
      localStorage.setItem('contestantVotes', JSON.stringify(votesObj));
    }

    // Ensure every contestant has a vote count (default 0)
    function initializeVotes() {
      let votes = getStoredVotes();
      let changed = false;
      for (let id in contestantsData) {
        if (typeof votes[id] !== 'number') {
          votes[id] = 0;
          changed = true;
        }
      }
      if (changed) saveStoredVotes(votes);
      return votes;
    }

    // Get current ID from URL (?id=xxx)
    function getContestantId() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      return (id && contestantsData[id]) ? id : 'offor';
    }

    const contestantId = getContestantId();
    const info = contestantsData[contestantId];

    // Update static info
    document.getElementById('contestantName').textContent = info.name;
    document.getElementById('contestantDetail').textContent = info.detail;
    document.getElementById('aboutText').textContent = info.about;
    const imageDiv = document.getElementById('dynamicImagePlaceholder');
    if (imageDiv) {
      imageDiv.style.backgroundImage = `url('${info.imageUrl}')`;
      imageDiv.style.backgroundSize = "cover";
      imageDiv.style.backgroundPosition = "center";
    }
    document.title = `GoVote — ${info.name}`;

    // ----- Vote counter (digits) based on stored votes -----
    let currentVotes = 0;

    const digitElements = {
      0: document.getElementById('digit1'),
      1: document.getElementById('digit2'),
      2: document.getElementById('digit3'),
      3: document.getElementById('digit4')
    };

    function updateDigitDisplay() {
      let voteValue = currentVotes;
      if (voteValue < 0) voteValue = 0;
      if (voteValue > 9999) voteValue = 9999;
      const padded = String(voteValue).padStart(4, '0');
      const digits = padded.split('');
      for (let i = 0; i < 4; i++) {
        if (digitElements[i]) digitElements[i].innerText = digits[i];
      }
    }

    function refreshVotesFromStorage() {
      const votes = getStoredVotes();
      currentVotes = votes[contestantId] || 0;
      updateDigitDisplay();
    }

    // Initialize votes (ensure all zero initially)
    initializeVotes();
    refreshVotesFromStorage();

    // Listen for storage changes (in case another tab updates votes)
    window.addEventListener('storage', (event) => {
      if (event.key === 'contestantVotes') {
        refreshVotesFromStorage();
      }
    });

    // ----- Redirect to voting page with this contestant's ID -----
    const voteBtn = document.getElementById('voteNowBtn');
    if (voteBtn) {
      voteBtn.addEventListener('click', () => {
        window.location.href = `voting.html?id=${contestantId}`;
      });
    }

    // ----- Back button -----
    const backBtn = document.querySelector('.back-btn');
    if (backBtn) {
      backBtn.addEventListener('click', () => window.history.back());
    }
  })();
</script>
</body>
</html>
