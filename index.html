<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>GoVote — Student Voting</title>
  <link rel="stylesheet" href="index.css">
  <!-- Google Fonts: Inter (premium, minimal) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 for lock icon & search icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<!-- ========== PREMIUM ROUND PRELOADER (3 seconds, only rotation) ========== -->
<div class="preloader" id="preloader">
  <div class="premium-spinner">
    <div class="spinner-ring"></div>
    <div class="spinner-core"></div>
  </div>
</div>

<div class="app-wrapper">
  <div class="container">
    <!-- 1. TOP SECTION: search bar + search icon button -->
    <div class="search-section">
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search events, elections..." aria-label="Search">
      </div>
      <button class="search-icon-btn" id="searchButton" aria-label="search">
        <i class="fas fa-arrow-right"></i>
      </button>
    </div>

    <!-- 2. BRANDING: GoVote (Go white, Vote gold) + subtitle -->
    <div class="branding">
      <div class="logo">
        <span class="logo-white">Go</span><span class="logo-gold">Vote</span>
      </div>
      <div class="subtitle">
        Giving power to the students. Vote for your favorite stars here.
      </div>
    </div>

    <!-- 3. SECTION LABEL: CHOOSE EVENT -->
    <div class="section-label">CHOOSE EVENT</div>

    <!-- 4. EVENT BLOCKS (image card + text below) -->
    <div class="events-list">
      
      <!-- ACTIVE EVENT: Unity Week 2026 -->
      <a href="unity week.html" style="text-decoration: none;">
        <div class="event-unit active-event-unit" data-event-type="active" data-event-name="Unity Week 2026">
          <div class="image-card">
            <img src="./IMG-20260505-WA0003.jpg" alt="Unity Week 2026" class="event-image" onerror="this.style.display='none'">
          </div>
          <div class="event-text">
            <div class="event-title">
              Unity Week <span class="gold-year">2026</span>
            </div>
            <div class="event-description">
              Giving power to the students. Vote for your favorite stars here.
            </div>
          </div>
        </div>
      </a>

      <!-- LOCKED EVENT: GOUNI COHON Election (with lock icon overlay) -->
      <div class="event-unit locked-event-unit" data-event-type="locked" data-event-name="GOUNI COHON Election">
        <div class="image-card">
          <img src="https://drive.google.com/uc?export=view&id=1kKP7fc-HAVWnQ4xFeNf9Q0QwsgYziTvi" alt="GOUNI COHON Election" class="event-image" onerror="this.style.display='none'">
          <div class="lock-overlay">
            <div class="lock-center">
              <i class="fas fa-lock"></i>
            </div>
          </div>
        </div>
        <div class="event-text">
          <div class="event-title">
            GOUNI COHON Election
          </div>
          <div class="event-description">
            Giving power to the students. Vote for your favorite stars here.
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER (copyright) -->
    <div class="footer">
      © 2026 GoVote — By Obi-Dev & SkillMynte
    </div>
  </div>
</div>

<script>
  // Ensure preloader lasts exactly 3 seconds, then fades out gracefully
  window.addEventListener('load', function() {
    const preloader = document.getElementById('preloader');
    if (preloader) {
      // Wait 3 seconds from page load before hiding (smooth premium experience)
      setTimeout(function() {
        preloader.classList.add('hide');
        // Optional: remove from DOM after transition
        setTimeout(function() {
          if (preloader.parentNode) {
            preloader.style.display = 'none';
          }
        }, 700);
      }, 2000); // 3 seconds exactly as requested
    }
  });

  // Fallback for extremely fast connections: still show minimum 3 seconds
  let preloaderVisible = true;
  setTimeout(function() {
    const preloader = document.getElementById('preloader');
    if (preloader && preloaderVisible) {
      preloader.classList.add('hide');
      setTimeout(function() {
        if (preloader.parentNode) preloader.style.display = 'none';
      }, 700);
    }
  }, 2000);

  // Existing event handlers
  document.addEventListener('DOMContentLoaded', function() {
    const activeEventUnit = document.querySelector('.event-unit.active-event-unit');
    const lockedEventUnit = document.querySelector('.event-unit.locked-event-unit');
    
    if (activeEventUnit) {
      activeEventUnit.addEventListener('click', function(e) {
        e.stopPropagation();
        console.log("Open event");
      });
    }
    
    if (lockedEventUnit) {
      lockedEventUnit.addEventListener('click', function(e) {
        e.stopPropagation();
        alert("This event is not available yet");
      });
    }
    
    const searchBtn = document.getElementById('searchButton');
    const searchField = document.querySelector('.search-bar input');
    if (searchBtn) {
      searchBtn.addEventListener('click', function() {
        const query = searchField ? searchField.value.trim() : '';
        if (query === "") {
          console.log("Search clicked (empty field)");
        } else {
          console.log(`Search query: "${query}"`);
        }
      });
    }
    if (searchField) {
      searchField.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const query = searchField.value.trim();
          console.log(query ? `Search via enter: "${query}"` : "Empty search via enter");
        }
      });
    }
    console.log("GoVote UI loaded — premium preloader fully hidden after 3 seconds.");
  });
</script>
</body>
</html>
