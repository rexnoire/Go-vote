<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>GoVote — Student Voting</title>
  <!-- Google Fonts: Inter (premium, minimal) -->
   <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 for lock icon & search icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="app-wrapper">
  <div class="container">
    <!-- 1. TOP SECTION: search bar + search icon button -->
    <div class="search-section">
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search events, elections..." aria-label="Search">
      </div>
      <button class="search-icon-btn" id="searchButton" aria-label="search">
        <i class="fas fa-arrow-right"></i>
      </button>
    </div>

    <!-- 2. BRANDING: GoVote (Go white, Vote gold) + subtitle -->
    <div class="branding">
      <div class="logo">
        <span class="logo-white">Go</span><span class="logo-gold">Vote</span>
      </div>
      <div class="subtitle">
        Giving power to the students. Vote for your favorite stars here.
      </div>
    </div>

    <!-- 3. SECTION LABEL: CHOOSE EVENT -->
    <div class="section-label">CHOOSE EVENT</div>

    <!-- 4. EVENT BLOCKS (exact pattern: image card + text below, no text inside card) -->
    <div class="events-list">
      
      <!-- ACTIVE EVENT: Unity Week 2026 -->
      <a href="unity week.html" style="text-decoration: none;"><div class="event-unit active-event-unit" data-event-type="active" data-event-name="Unity Week 2026">
        <!-- Image card separate block: rounded corners, dark bg, EMPTY placeholder (no lock) -->
        <div class="image-card">
          <div class="placeholder-empty">
            <!-- completely empty for active event, no lock icon, just an empty rectangular image placeholder -->
          </div>
        </div>
        <!-- TEXT BELOW CARD (NOT inside the image card) -->
        <div class="event-text">
          <div class="event-title">
            Unity Week <span class="gold-year">2026</span>
          </div>
          <div class="event-description">
            Giving power to the students. Vote for your favorite stars here.
          </div>
        </div>
      </div></a>

      <!-- LOCKED EVENT: GOUNI COHON Election (with lock icon CENTER of image card) -->
      <div class="event-unit locked-event-unit" data-event-type="locked" data-event-name="GOUNI COHON Election">
        <!-- Image card separate block: rounded corners, dark bg, with lock icon in the CENTER -->
        <div class="image-card">
          <div class="placeholder-empty">
            <div class="lock-center">
              <i class="fas fa-lock"></i>
            </div>
          </div>
        </div>
        <!-- TEXT BELOW CARD -->
        <div class="event-text">
          <div class="event-title">
            GOUNI COHON Election
          </div>
          <div class="event-description">
            Giving power to the students. Vote for your favorite stars here.
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER (copyright) -->
    <div class="footer">
      © 2026 GoVote — By Obi-Dev & SkillMynte
    </div>
  </div>
</div>

<script>
  // JavaScript: 
  // - Click active card → console.log("Open event")
  // - Click locked card → alert("This event is not available yet")
  // - Keep simple, no redesign, no extra DOM manipulation that alters structure.
  
  document.addEventListener('DOMContentLoaded', function() {
    // Get both event units using data attributes or classes
    const activeEventUnit = document.querySelector('.event-unit.active-event-unit');
    const lockedEventUnit = document.querySelector('.event-unit.locked-event-unit');
    
    // Active event: click -> console.log("Open event")
    if (activeEventUnit) {
      activeEventUnit.addEventListener('click', function(e) {
        // prevents any weird bubbling but does not affect layout
        e.stopPropagation();
        console.log("Open event");
        // optional additional debug (just to match requirement exactly, still premium)
        // but we don't change anything.
      });
    }
    
    // Locked event: click -> alert("This event is not available yet")
    if (lockedEventUnit) {
      lockedEventUnit.addEventListener('click', function(e) {
        e.stopPropagation();
        alert("This event is not available yet");
      });
    }
    
    // Optional (bonus extra but does not break any rule): search button console log demo
    const searchBtn = document.getElementById('searchButton');
    const searchField = document.querySelector('.search-bar input');
    if (searchBtn) {
      searchBtn.addEventListener('click', function() {
        const query = searchField ? searchField.value.trim() : '';
        if (query === "") {
          console.log("Search clicked (empty field)");
        } else {
          console.log(`Search query: "${query}"`);
        }
      });
    }
    // Enter key on search field logs to console (non-intrusive)
    if (searchField) {
      searchField.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const query = searchField.value.trim();
          console.log(query ? `Search via enter: "${query}"` : "Empty search via enter");
        }
      });
    }
    
    // Extra structural verification note: all image cards remain empty placeholders, no text inside.
    // Lock icon exactly centered inside locked image card.
    console.log("GoVote UI loaded — layout matches exact screenshot rules: separate image cards, text below, locked icon centered.");
  });
</script>
</body>
</html>
