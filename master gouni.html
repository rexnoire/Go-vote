<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>GoVote — Master GOUNI 2026</title>
  <link rel="stylesheet" href="master gouni.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
<div class="phone-container">
  <div class="app-content">
    <div class="top-bar">
      <button class="back-button back-btn" aria-label="Back">
        <svg class="back-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
    </div>

    <div class="small-label">UNIVERSITY STUDENT WEEK</div>
    <div class="main-title">
      Master GOUNI <span class="title-accent">2026</span>
    </div>
    <div class="description">
      Browse through multiple categories and vote for your respective stars.
    </div>

    <div class="search-wrapper">
      <input type="text" class="search-input" placeholder="Search contestant">
      <button class="search-icon-btn" id="searchBtn" aria-label="Search">
        <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <line x1="15" y1="15" x2="21" y2="21" />
        </svg>
      </button>
    </div>

    <div class="section-spacing">
      <div class="section-header">
        <div class="section-label">TOP 3 CONTESTANTS</div>
      </div>
      <div class="top-three-row">
        <div class="top-card" data-id="offor">
          <div class="card-number accent-number">01</div>
        </div>
        <div class="top-card" data-id="obi">
          <div class="card-number muted-number">02</div>
        </div>
        <div class="top-card" data-id="mark">
          <div class="card-number muted-number">03</div>
        </div>
      </div>
    </div>

    <div class="lineup-section">
      <div class="section-header">
        <div class="section-label">THIS YEAR'S LINEUP</div>
      </div>

      <div class="contestants-grid" id="contestantsContainer">
        <div class="contestant-card" data-id="offor">
          <div class="image-placeholder"></div>
          <div class="bottom-overlay">
            <span class="contestant-name">Offor Franklin</span>
            <button class="star-button star-toggle" data-star="offor" data-filled="true">
              <svg class="star-icon star-filled" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27Z" fill="#C9A95C" stroke="#C9A95C" stroke-width="1"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="contestant-card" data-id="obi">
          <div class="image-placeholder"></div>
          <div class="bottom-overlay">
            <span class="contestant-name">Obi Emmanuel</span>
            <button class="star-button star-toggle" data-star="obi" data-filled="false">
              <svg class="star-icon star-outline" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27Z" fill="none" stroke="#9A9A9A" stroke-width="1.8"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="contestant-card" data-id="mark">
          <div class="image-placeholder"></div>
          <div class="bottom-overlay">
            <span class="contestant-name">Mark Roth</span>
            <button class="star-button star-toggle" data-star="obi" data-filled="false">
              <svg class="star-icon star-outline" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27Z" fill="none" stroke="#9A9A9A" stroke-width="1.8"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="contestant-card" data-id="jonah">
          <div class="image-placeholder"></div>
          <div class="bottom-overlay">
            <span class="contestant-name">Jonah Kennard</span>
            <button class="star-button star-toggle" data-star="obi" data-filled="false">
              <svg class="star-icon star-outline" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27Z" fill="none" stroke="#9A9A9A" stroke-width="1.8"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="contestant-card" data-id="kolu">
          <div class="image-placeholder"></div>
          <div class="bottom-overlay">
            <span class="contestant-name">Kolu Anthony</span>
            <button class="star-button star-toggle" data-star="obi" data-filled="false">
              <svg class="star-icon star-outline" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27Z" fill="none" stroke="#9A9A9A" stroke-width="1.8"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      © 2026 GoVote — By Obi-Dev & SkillMynte
    </div>
  </div>
</div>

<script>
  (function() {
    // Search button console log
    const searchBtn = document.getElementById('searchBtn');
    if (searchBtn) {
      searchBtn.addEventListener('click', function(e) {
        e.preventDefault();
        console.log("search clicked");
      });
    }

    // Redirect to contestant page with unique ID
    const allCards = document.querySelectorAll('.contestant-card, .top-card');
    
    function redirectToContestant(contestantId) {
      window.location.href = `contestant.html?id=${encodeURIComponent(contestantId)}`;
    }
    
    allCards.forEach(card => {
      card.addEventListener('click', function(e) {
        // Prevent redirect if star button was clicked
        let target = e.target;
        let isStarButton = false;
        while (target && target !== card) {
          if (target.classList && target.classList.contains('star-toggle') || target.closest('.star-toggle')) {
            isStarButton = true;
            break;
          }
          target = target.parentNode;
        }
        
        if (!isStarButton) {
          console.log("card clicked");
          const id = card.getAttribute('data-id');
          if (id) {
            redirectToContestant(id);
          }
        }
      });
    });

    // Star toggle logic (unchanged)
    const starButtons = document.querySelectorAll('.star-toggle');
    
    function updateStarIcon(button, isFilledNow) {
      const parent = button;
      if (!parent) return;
      let newSvg;
      if (isFilledNow) {
        newSvg = `<svg class="star-icon star-filled" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27Z" fill="#C9A95C" stroke="#C9A95C" stroke-width="1"/>
          </svg>`;
      } else {
        newSvg = `<svg class="star-icon star-outline" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27Z" fill="none" stroke="#9A9A9A" stroke-width="1.8"/>
          </svg>`;
      }
      parent.innerHTML = newSvg;
      parent.setAttribute('data-filled', isFilledNow ? 'true' : 'false');
    }

    starButtons.forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const currentlyFilled = this.getAttribute('data-filled') === 'true';
        const newFilledState = !currentlyFilled;
        updateStarIcon(this, newFilledState);
      });
    });

    // Set initial stars
    const offorStarBtn = document.querySelector('.star-toggle[data-star="offor"]');
    if (offorStarBtn && offorStarBtn.getAttribute('data-filled') !== 'true') {
      offorStarBtn.setAttribute('data-filled', 'true');
      updateStarIcon(offorStarBtn, true);
    }
    const obiStarBtn = document.querySelector('.star-toggle[data-star="obi"]');
    if (obiStarBtn && obiStarBtn.getAttribute('data-filled') !== 'false') {
      obiStarBtn.setAttribute('data-filled', 'false');
      updateStarIcon(obiStarBtn, false);
    }
    const mikoStarBtn = document.querySelector('.star-toggle[data-star="miko"]');
    if (mikoStarBtn && mikoStarBtn.getAttribute('data-filled') !== 'false') {
      mikoStarBtn.setAttribute('data-filled', 'false');
      updateStarIcon(mikoStarBtn, false);
    }

    // Back button
    const backBtn = document.querySelector(".back-btn");
    if (backBtn) {
      backBtn.addEventListener("click", () => {
        window.history.back();
      });
    }
  })();
</script>
</body>
</html>
